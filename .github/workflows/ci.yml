name: MLIR 18 build and regression

on:
  push:
  pull_request:

jobs:
  ubuntu-24-04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and MLIR 18
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 llvm-18-dev mlir-18-tools libmlir-18-dev \
            cmake ninja-build python3
      - name: Build
        run: bash scripts/01_build.sh
      - name: Run v0-v5 regression
        run: |
          bash scripts/02_test.sh
          bash scripts/03_test_dialect.sh
          bash scripts/04_test_fusion.sh
          bash scripts/05_test_tiling.sh
          bash scripts/06_test_lowering.sh
          bash scripts/07_test_bufferization.sh
